<title>SYNTS Everink</title>

<!-- Apply saved theme before the page paints (prevents a white/dark flash) -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('synts_settings') || '{}');
    var t = s.theme || 'system';
    if (t === 'system') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    var r = document.documentElement;
    r.setAttribute('data-theme', t);
    r.setAttribute('data-accent', s.accent || 'green');
    r.setAttribute('data-font', s.fontSize || 'm');
    if (s.reduceMotion) r.classList.add('reduce-motion');
  } catch (e) {}
})();
</script>
